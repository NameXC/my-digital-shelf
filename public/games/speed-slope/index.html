<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Slope</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #231F20; overflow: hidden; }
    #unity-container { width: 100%; height: 100%; position: relative; }
    #unity-canvas { width: 100%; height: 100%; display: block; }
    #loading-cover {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #231F20; color: #fff;
      font-family: Helvetica, Arial, sans-serif;
    }
    #progress-bar { width: 240px; height: 18px; position: relative; }
    #progress-bar-empty { width: 100%; height: 100%; background: rgba(255,255,255,0.15); }
    #progress-bar-full { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: #3d63cd; transition: width 0.2s; }
  </style>
  <script>
    // The build was wrapped by the gmsoft/Yoplay SDK. That wrapper expects the host page to
    // supply globals which its own remote "gmsoft-jssdk" script normally defines: `config`,
    // `firebaseLogEvent`, `firebaseLogEventParameter`, `gmEvent`, `gmStartGame`, `gmStartAds`
    // and `loadGMData`. Nothing on this page defined them, so:
    //   1. the SDK wrapper threw "Uncaught ReferenceError: config is not defined" while booting,
    //      which aborted the rest of the wrapper before it could finish wiring itself up, and
    //   2. any event the game reports then called an undefined `firebaseLogEvent`.
    // Pressing START NEW GAME / START WITH ID makes the game report "start-game", so that
    // ReferenceError was thrown across the WebAssembly boundary straight back into Unity's
    // main thread and wedged it - the "freeze" on both buttons.
    // Supplying a config with an empty eventAPI keeps those calls harmless: gmsoft's own
    // loadGMData() returns immediately when eventAPI is unset, so no analytics/ads traffic
    // is sent and the game can carry on.
    (function () {
      if (!window.config) {
        window.config = {
          sourceHtml: "",
          eventAPI: "",
          eventLog: false,
          gameId: "",
          referrer: document.referrer,
          domainHost: window.location.hostname,
          hostname: window.location.hostname,
        };
      }
      if (!window.GMSOFT_OPTIONS) window.GMSOFT_OPTIONS = window.config;
      var noop = function () {};
      window.firebaseLogEvent = window.firebaseLogEvent || noop;
      window.firebaseLogEventParameter = window.firebaseLogEventParameter || noop;
      window.loadGMData = window.loadGMData || noop;
      window.gmEvent = window.gmEvent || noop;
      window.gmdebug = window.gmdebug || noop;
      window.gmStartGame = window.gmStartGame || function (cb) { if (typeof cb === "function") cb(); };
      window.gmStartAds = window.gmStartAds || function (cb) { if (typeof cb === "function") cb(); };
    })();
  </script>
  <!--
    The gmsoft licence-replay block that used to live here was removed on purpose.
    It replayed a captured keysigned signature and spoofed window.location to
    games.ofree.io so the remote SDK domain check would pass. That can never work:
    the SDK verifies a fresh, server-minted, time-limited signature for the licensed
    host, so a replay always ends in check sign: False and Game is locked. Those
    checks live in the remotely loaded SDK and are not ours to defeat. See the
    Speed Slope licence section in README.md for the background and options.
  -->
  <!--
    The Unity build calls these globals directly (Unity's __Internal bridge, see the
    blob in speed-slope-v26060301.framework.js.unityweb). The original host page at
    https://games.ofree.io/speed-slope/play.html defines them next to its Firebase
    SDK snippet. Without them the game throws "ReferenceError: firebaseLogEvent is
    not defined" the moment you press START NEW GAME / START WITH ID, which aborts
    the start-game routine and looks like a freeze.

    They are intentionally no-ops here: this is a self-hosted copy, so analytics
    must not be sent to the original publisher's Firebase project. The functions
    keep the exact names and signatures the game expects, so gameplay is unaffected.
  -->
  <script>
    (function () {
      // The game's SDK layer reports which SDK it is running under.
      window.GMSOFT_SDKTYPE = window.GMSOFT_SDKTYPE || "gm";
      // Stand-in for the original page's Firebase config, so the guards in the
      // functions below behave the same way they do upstream (no config = no-op).
      window.firebaseConfig = window.firebaseConfig || undefined;
    })();

    function firebaseLogEvent(event_name) {
      if (typeof firebaseConfig === "undefined") return;
      try { firebase.analytics().logEvent(event_name); } catch (e) {}
    }

    function firebaseLogEventParameter(event_name, event_param) {
      if (typeof firebaseConfig === "undefined") return;
      try { firebase.analytics().logEvent(event_name, event_param); } catch (e) {}
    }

    function firebaseSetUserProperties(props) {
      if (typeof firebaseConfig === "undefined") return;
      try { firebase.analytics().setUserProperties(props); } catch (e) {}
    }
  </script>
  <script src="speed-slope-v26060301.loader.js"></script>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading-cover">
      <div style="font-size: 20px; font-weight: 700;">Speed Slope</div>
      <div id="progress-bar">
        <div id="progress-bar-empty"></div>
        <div id="progress-bar-full"></div>
      </div>
    </div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var progressBarFull = document.querySelector("#progress-bar-full");
    var loadingCover = document.querySelector("#loading-cover");
    createUnityInstance(canvas, {
      dataUrl: "speed-slope-v26060301.data.unityweb",
      frameworkUrl: "speed-slope-v26060301.framework.js.unityweb",
      codeUrl: "speed-slope-v26060301.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "IDnet",
      productName: "Speed Slope",
      productVersion: "1.0",
    }, function (progress) {
      progressBarFull.style.width = 100 * progress + "%";
    }).then(function (unityInstance) {
      loadingCover.style.display = "none";
    }).catch(function (message) {
      alert(message);
    });
  </script>
</body>
</html>
